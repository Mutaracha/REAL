name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_DIR: build

jobs:
  windows:
    name: Windows (MSVC, Release)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -S real-app -B ${{ env.BUILD_DIR }} -A x64

      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci | Out-Null
          cmake --build ${{ env.BUILD_DIR }} --config Release --parallel 2>&1 | Tee-Object -FilePath ci/build.log
          $code = $LASTEXITCODE
          "cmake --build exit code: $code" | Out-File -Append -Encoding utf8 ci/build.log
          exit $code

      - name: Show compiler output
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ci/build.log) { Get-Content ci/build.log -Tail 200 }

      # The documented MSVC-only build path must keep working as well.
      - name: Build without CMake (build.bat)
        if: steps.build.outcome == 'success'
        shell: cmd
        run: |
          cd real-app
          call build.bat
          if errorlevel 1 exit /b 1
          if not exist build\REAL.exe exit /b 1

      # The runner has no audio endpoint, so the application is expected to log
      # the failure and keep running. This checks that the executable starts,
      # writes its log, answers a second instance and shuts down cleanly.
      - name: Smoke test
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci | Out-Null
          $exe = (Resolve-Path "${{ env.BUILD_DIR }}/Release/REAL.exe").Path
          $log = "ci/smoke.log"
          "== first instance ==" | Out-File -Encoding utf8 $log
          (Get-Item $exe).VersionInfo | Out-String | Out-File -Append -Encoding utf8 $log

          $main = Start-Process -FilePath $exe -ArgumentList '--tray', '--no-config' -PassThru
          Start-Sleep -Seconds 6
          "main pid=$($main.Id) alive=$(-not $main.HasExited)" | Out-File -Append -Encoding utf8 $log
          if ($main.HasExited) {
            "the application exited immediately, code $($main.ExitCode)" | Out-File -Append -Encoding utf8 $log
            exit 1
          }

          "== second instance (--exit) ==" | Out-File -Append -Encoding utf8 $log
          $second = Start-Process -FilePath $exe -ArgumentList '--exit' -PassThru
          if (-not $second.WaitForExit(20000)) {
            $second.Kill()
            "the second instance did not exit" | Out-File -Append -Encoding utf8 $log
            $main.Kill()
            exit 1
          }
          "second instance exit code $($second.ExitCode)" | Out-File -Append -Encoding utf8 $log

          if (-not $main.WaitForExit(20000)) {
            $main.Kill()
            "the running instance did not shut down after --exit" | Out-File -Append -Encoding utf8 $log
            exit 1
          }
          "main instance exit code $($main.ExitCode)" | Out-File -Append -Encoding utf8 $log

          "== log file ==" | Out-File -Append -Encoding utf8 $log
          if (-not (Test-Path "${{ env.BUILD_DIR }}/Release/REAL.log")) {
            "REAL.log was not written next to the executable" | Out-File -Append -Encoding utf8 $log
            exit 1
          }
          Get-Content "${{ env.BUILD_DIR }}/Release/REAL.log" | Out-File -Append -Encoding utf8 $log

          if ($main.ExitCode -ne 0) {
            "the application reported a failure, exit code $($main.ExitCode)" | Out-File -Append -Encoding utf8 $log
            exit 1
          }

          # The settings file is generated with comments; it must be readable by
          # the application itself (a second start loads it without warnings).
          "== generated settings file ==" | Out-File -Append -Encoding utf8 $log
          $work = Join-Path $env:RUNNER_TEMP "real-settings-test"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Copy-Item $exe (Join-Path $work "REAL.exe")
          $first = Start-Process -FilePath (Join-Path $work "REAL.exe") -ArgumentList '--tray' -WorkingDirectory $work -PassThru
          Start-Sleep -Seconds 6
          (Join-Path $work "REAL.log") | ForEach-Object { if (Test-Path $_) { Remove-Item $_ } }
          $second = Start-Process -FilePath (Join-Path $work "REAL.exe") -ArgumentList '--exit' -WorkingDirectory $work -PassThru
          $second.WaitForExit(20000) | Out-Null
          Start-Sleep -Seconds 3
          $strict = Start-Process -FilePath (Join-Path $work "REAL.exe") -ArgumentList '--tray' -WorkingDirectory $work -PassThru
          Start-Sleep -Seconds 5
          $exit2 = Start-Process -FilePath (Join-Path $work "REAL.exe") -ArgumentList '--exit' -WorkingDirectory $work -PassThru
          $exit2.WaitForExit(20000) | Out-Null
          if ($first.HasExited) { $first.Kill() }
          if ($strict.HasExited) { $strict.Kill() }
          if (-not (Test-Path (Join-Path $work "real.settings.json"))) {
            "real.settings.json was not created next to the executable" | Out-File -Append -Encoding utf8 $log
            exit 1
          }
          Get-Content (Join-Path $work "real.settings.json") -TotalCount 12 | Out-File -Append -Encoding utf8 $log
          $settingsLog = Join-Path $work "REAL.log"
          if (Test-Path $settingsLog) {
            Get-Content $settingsLog | Out-File -Append -Encoding utf8 $log
            $bad = Select-String -Path $settingsLog -Pattern "Could not parse the settings file|Settings: .*expected|Settings: unknown"
            if ($bad) {
              "the generated settings file does not load cleanly" | Out-File -Append -Encoding utf8 $log
              exit 1
            }
          } else {
            "no log was written during the settings test" | Out-File -Append -Encoding utf8 $log
            exit 1
          }

          # --diagnose must produce a report even on a runner without audio.
          "== diagnostics report ==" | Out-File -Append -Encoding utf8 $log
          $diag = Start-Process -FilePath (Join-Path $work "REAL.exe") -ArgumentList '--no-config','--diagnose' -WorkingDirectory $work -PassThru -Wait
          if ($diag.ExitCode -ne 0) {
            "the diagnostics report could not be written, exit code $($diag.ExitCode)" | Out-File -Append -Encoding utf8 $log
            exit 1
          }
          if (-not (Test-Path (Join-Path $work "REAL-diagnostics.txt"))) {
            "REAL-diagnostics.txt was not written" | Out-File -Append -Encoding utf8 $log
            exit 1
          }
          Get-Content (Join-Path $work "REAL-diagnostics.txt") | Out-File -Append -Encoding utf8 $log

          "smoke test passed" | Out-File -Append -Encoding utf8 $log

      - name: Show smoke test output
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ci/smoke.log) {
            Get-Content ci/smoke.log
            "# Smoke test`n" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
            Get-Content ci/smoke.log | Out-File -Append $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          }

      # Compiler or runtime diagnostics are published both as check annotations
      # and as files in the repository, so that the reason of a failure is
      # visible even when the job log cannot be downloaded.
      - name: Publish diagnostics
        if: steps.build.outcome == 'failure' || steps.smoke.outcome == 'failure'
        shell: pwsh
        run: |
          $errors = @()
          if (Test-Path ci/build.log) {
            $errors += Select-String -Path ci/build.log -Pattern 'error [A-Z]+[0-9]+' |
              ForEach-Object { $_.Line.Trim() } | Select-Object -Unique -First 8
          }
          if (Test-Path ci/smoke.log) {
            $errors += Get-Content ci/smoke.log | Select-Object -Last 12
          }
          foreach ($line in $errors) { Write-Host "::error::$line" }
          if ($errors.Count -gt 0) {
            "# Diagnostics`n" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
            $errors | Out-File -Append $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          }

      - name: Commit diagnostics
        if: (steps.build.outcome == 'failure' || steps.smoke.outcome == 'failure') && github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Get-ChildItem ci -Filter *.log | ForEach-Object { git add -f $_.FullName }
          git diff --cached --quiet; if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "ci: build log [skip ci]"
          git push

      - name: Upload artifact
        if: steps.build.outcome == 'success' && steps.smoke.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: REAL-x64
          path: ${{ env.BUILD_DIR }}/Release/REAL.exe
          if-no-files-found: error

      - name: Fail when a step failed
        if: steps.build.outcome == 'failure' || steps.smoke.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "Build or smoke test failed, see ci/*.log"
          exit 1

  release:
    name: Attach the executable to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -S real-app -B ${{ env.BUILD_DIR }} -A x64

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config Release --parallel

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "REAL $tag" --generate-notes
          }
          gh release upload $tag "${{ env.BUILD_DIR }}/Release/REAL.exe#REAL.exe" --clobber
