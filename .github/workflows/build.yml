name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_DIR: build

jobs:
  windows:
    name: Windows (MSVC, Release)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S real-app -B ${{ env.BUILD_DIR }} -A x64

      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci | Out-Null
          cmake --build ${{ env.BUILD_DIR }} --config Release --parallel 2>&1 | Tee-Object -FilePath ci/build.log
          $code = $LASTEXITCODE
          "cmake --build exit code: $code" | Out-File -Append -Encoding utf8 ci/build.log
          exit $code

      - name: Show compiler output
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ci/build.log) { Get-Content ci/build.log -Tail 300 }

      # Compiler diagnostics are published both as check annotations and as a
      # file in the repository, so that the reason of a failure is visible even
      # when the job log cannot be downloaded.
      - name: Publish diagnostics
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          $errors = Select-String -Path ci/build.log -Pattern 'error [A-Z]+[0-9]+' |
            ForEach-Object { $_.Line.Trim() } | Select-Object -Unique -First 10
          foreach ($line in $errors) { Write-Host "::error::$line" }

      - name: Commit diagnostics
        if: steps.build.outcome == 'failure' && github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci/build.log
          git diff --cached --quiet; if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "ci: build log [skip ci]"
          git push

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: REAL-x64
          path: ${{ env.BUILD_DIR }}/Release/REAL.exe
          if-no-files-found: error

      - name: Fail when the build failed
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "Build failed, see ci/build.log"
          exit 1

  release:
    name: Attach the executable to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S real-app -B ${{ env.BUILD_DIR }} -A x64

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config Release --parallel

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "REAL $tag" --generate-notes
          }
          gh release upload $tag "${{ env.BUILD_DIR }}/Release/REAL.exe#REAL.exe" --clobber
