name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_DIR: build
  # The number of the run ends up in the version of the build: "RC 39".
  REAL_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  windows:
    name: Windows (MSVC, Release)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -S real-app -B ${{ env.BUILD_DIR }} -A x64

      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci | Out-Null
          cmake --build ${{ env.BUILD_DIR }} --config Release --parallel 2>&1 | Tee-Object -FilePath ci/build.log
          $code = $LASTEXITCODE
          "cmake --build exit code: $code" | Out-File -Append -Encoding utf8 ci/build.log
          exit $code

      - name: Show compiler output
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ci/build.log) { Get-Content ci/build.log -Tail 200 }

      # The size of the executable and what it is made of (from the map file of
      # the linker): a notice of the check and a section of the summary.
      - name: Size report
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: python .github/size-report.py "${{ env.BUILD_DIR }}/Release/REAL.exe" "${{ env.BUILD_DIR }}/REAL.map"

      # The documented MSVC-only build path must keep working as well.
      - name: Build without CMake (build.bat)
        if: steps.build.outcome == 'success'
        shell: cmd
        run: |
          cd real-app
          call build.bat
          if errorlevel 1 exit /b 1
          if not exist build\REAL.exe exit /b 1

      # The runner has no audio endpoint, so the application is expected to log
      # the failure and keep running. This checks that the executable starts,
      # writes its log, answers a second instance and shuts down cleanly.
      - name: Smoke test
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci | Out-Null
          $log = "ci/smoke.log"
          $exe = (Resolve-Path "${{ env.BUILD_DIR }}/Release/REAL.exe").Path
          Set-Content -Path $log -Value "REAL smoke test"
          function Add-Log([string] $text) { $text | Out-File -Append -Encoding utf8 $log }

          function Stop-Quietly($process) {
            if ($null -ne $process) {
              try { if (-not $process.HasExited) { $process.Kill() } } catch {}
            }
          }

          function Start-Real([string] $directory, [string[]] $arguments) {
            return Start-Process -FilePath (Join-Path $directory "REAL.exe") -ArgumentList $arguments `
              -WorkingDirectory $directory -PassThru
          }

          try {
            Add-Log "== first instance =="
            (Get-Item $exe).VersionInfo | Out-String | Out-File -Append -Encoding utf8 $log

            # The log file is off by default: the runs that are checked through
            # REAL.log switch it on for themselves (a launch key holds for one run).
            $main = Start-Real "${{ env.BUILD_DIR }}/Release" @('--tray', '--no-config', '--log-level', 'info')
            Start-Sleep -Seconds 6
            Add-Log "main pid=$($main.Id) alive=$(-not $main.HasExited)"
            if ($main.HasExited) { throw "the application exited immediately with code $($main.ExitCode)" }

            Add-Log "== second instance (--exit) =="
            $second = Start-Real "${{ env.BUILD_DIR }}/Release" @('--exit')
            if (-not $second.WaitForExit(20000)) { throw "the second instance did not exit" }
            Add-Log "second instance exit code $($second.ExitCode)"

            if (-not $main.WaitForExit(20000)) { throw "the running instance did not shut down after --exit" }
            Add-Log "main instance exit code $($main.ExitCode)"
            if ($main.ExitCode -ne 0) { throw "the application reported a failure, exit code $($main.ExitCode)" }

            $appLog = Join-Path "${{ env.BUILD_DIR }}/Release" "REAL.log"
            Add-Log "== log file =="
            if (-not (Test-Path $appLog)) { throw "REAL.log was not written next to the executable" }
            Get-Content $appLog | Out-File -Append -Encoding utf8 $log

            # The settings file is generated with comments; the application must
            # be able to read it back on the next start.
            Add-Log "== generated settings file =="
            $work = Join-Path $env:RUNNER_TEMP "real-settings-test"
            if (Test-Path $work) { Remove-Item -Recurse -Force $work }
            New-Item -ItemType Directory -Force -Path $work | Out-Null
            Copy-Item $exe (Join-Path $work "REAL.exe")

            $first = Start-Real $work @('--tray', '--log-level', 'info')
            Start-Sleep -Seconds 6
            Add-Log "first instance alive=$(-not $first.HasExited)"
            if ($first.HasExited) { throw "the application exited immediately in the settings test" }

            $exitFirst = Start-Real $work @('--exit')
            if (-not $exitFirst.WaitForExit(20000)) { throw "the settings-test instance did not exit" }
            if (-not $first.WaitForExit(20000)) { throw "the settings-test instance did not shut down" }

            $settings = Join-Path $work "real.settings.json"
            if (-not (Test-Path $settings)) { throw "real.settings.json was not created next to the executable" }
            Get-Content $settings -TotalCount 14 | Out-File -Append -Encoding utf8 $log

            # Second start: the generated file must load without any warning.
            $strict = Start-Real $work @('--tray', '--log-level', 'info')
            Start-Sleep -Seconds 6
            $exitStrict = Start-Real $work @('--exit')
            if (-not $exitStrict.WaitForExit(20000)) { throw "the second settings-test instance did not exit" }
            if (-not $strict.WaitForExit(20000)) { throw "the second settings-test instance did not shut down" }

            $settingsLog = Join-Path $work "REAL.log"
            if (-not (Test-Path $settingsLog)) { throw "no log was written during the settings test" }
            Get-Content $settingsLog | Out-File -Append -Encoding utf8 $log

            # The startup banner also contains "Settings: <path>", so only
            # warnings and errors about the settings file count as a problem.
            $bad = Select-String -Path $settingsLog -Pattern "\[(warn|warning|error)\].*[Ss]ettings|Could not parse the settings file"
            if ($bad) {
              $bad | ForEach-Object { Add-Log "unexpected settings message: $($_.Line)" }
              throw "the generated settings file does not load cleanly"
            }

            # A settings file larger than 100 KB is renamed to "<name>.bak" and a
            # file with the defaults takes its place; a read-only one stays as
            # it is. The runner speaks English.
            Add-Log "== settings file larger than 100 KB =="
            $large = Join-Path $env:RUNNER_TEMP "real-large-settings"
            if (Test-Path $large) { Remove-Item -Recurse -Force $large }
            New-Item -ItemType Directory -Force -Path $large | Out-Null
            Copy-Item $exe (Join-Path $large "REAL.exe")
            $largeFile = Join-Path $large "real.settings.json"
            $largeBackup = "$largeFile.bak"
            $largeLog = Join-Path $large "REAL.log"
            $largeContent = '{ "padding": "' + ('x' * 153600) + '" }'
            [System.IO.File]::WriteAllText($largeFile, $largeContent)
            $largeSize = (Get-Item $largeFile).Length

            $big = Start-Real $large @('--tray', '--log-level', 'info')
            Start-Sleep -Seconds 6
            $exitBig = Start-Real $large @('--exit')
            if (-not $exitBig.WaitForExit(20000)) { throw "the large-settings instance did not exit" }
            if (-not $big.WaitForExit(20000)) { throw "the large-settings instance did not shut down" }
            if (Test-Path $largeLog) { Get-Content $largeLog | Out-File -Append -Encoding utf8 $log }
            if (-not (Test-Path $largeBackup)) { throw "the large settings file was not renamed to .bak" }
            if ((Get-Item $largeBackup).Length -ne $largeSize) { throw "the .bak file is not the large settings file" }
            if (-not (Test-Path $largeFile)) { throw "no settings file with the defaults after the rename" }
            if ((Get-Item $largeFile).Length -ge 102400) { throw "the new settings file is larger than 100 KB" }
            if (-not (Select-String -Path $largeLog -Pattern "\.bak" -Quiet)) { throw "no .bak in the log" }
            Add-Log "renamed: .bak $((Get-Item $largeBackup).Length) B, new $((Get-Item $largeFile).Length) B"

            Add-Log "== read-only settings file larger than 100 KB =="
            Remove-Item -Force $largeFile, $largeBackup, $largeLog
            [System.IO.File]::WriteAllText($largeFile, $largeContent)
            Set-ItemProperty -Path $largeFile -Name IsReadOnly -Value $true

            $locked = Start-Real $large @('--tray', '--log-level', 'info')
            Start-Sleep -Seconds 6
            $exitLocked = Start-Real $large @('--exit')
            if (-not $exitLocked.WaitForExit(20000)) { throw "the read-only-settings instance did not exit" }
            if (-not $locked.WaitForExit(20000)) { throw "the read-only-settings instance did not shut down" }
            if (Test-Path $largeLog) { Get-Content $largeLog | Out-File -Append -Encoding utf8 $log }
            if (Test-Path $largeBackup) { throw "a read-only settings file was renamed" }
            if ((Get-Item $largeFile).Length -ne $largeSize) { throw "a read-only settings file was changed" }
            if (-not (Select-String -Path $largeLog -Pattern "100 KB" -Quiet)) { throw "no limit in the log" }
            Set-ItemProperty -Path $largeFile -Name IsReadOnly -Value $false

            # --diagnose must produce a report even on a runner without audio.
            Add-Log "== diagnostics report =="
            $diag = Start-Real $work @('--no-config', '--diagnose', '--log-level', 'info')
            if (-not $diag.WaitForExit(60000)) { throw "the diagnostics command did not finish" }
            Add-Log "diagnostics exit code $($diag.ExitCode)"
            $workLog = Join-Path $work "REAL.log"
            Add-Log "log file exists: $(Test-Path $workLog); size: $(if (Test-Path $workLog) { (Get-Item $workLog).Length } else { -1 })"
            if (Test-Path $workLog) {
              Add-Log "== application log after the diagnostics run =="
              Get-Content $workLog | Out-File -Append -Encoding utf8 $log
            }


            # Turn the fault offset from the Windows event log into a function
            # name with the help of the linker map file.
            $crashOffset = $null
            try {
              $event = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction Stop |
                Where-Object { $_.Message -like '*REAL.exe*' -and $_.Message -like '*Fault offset*' } | Select-Object -First 1
              if ($event) {
                if ($event.Message -match 'Fault offset: 0x([0-9a-fA-F]+)') { $crashOffset = $matches[1] }
              }
            } catch {}

            $map = "${{ env.BUILD_DIR }}/REAL.map"
            if ($crashOffset -and (Test-Path $map)) {
              Add-Log "== symbol lookup for the fault offset 0x$crashOffset =="
              $target = 0x140000000 + [Convert]::ToInt64($crashOffset, 16)
              $best = $null
              foreach ($line in Get-Content $map) {
                if ($line -match '^\s+[0-9a-f]{4}:[0-9a-f]{8}\s+(\S+)\s+([0-9a-f]{16})') {
                  $address = [Convert]::ToInt64($matches[2], 16)
                  if ($address -le $target) { $best = "$($matches[1]) at 0x$($matches[2])" } else { break }
                }
              }
              Add-Log "the crash is inside: $best"

            }

            Add-Log "== crash information =="
            try {
              Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction Stop |
                Where-Object { $_.Message -like '*REAL*' -or $_.ProviderName -like '*Error Reporting*' } |
                Select-Object -First 5 |
                ForEach-Object { Add-Log ($_.ProviderName + ": " + $_.Message) }
            } catch {
              Add-Log "the event log could not be read: $($_.Exception.Message)"
            }
            $report = Join-Path $work "REAL-diagnostics.txt"
            if (-not (Test-Path $report)) { throw "REAL-diagnostics.txt was not written" }
            Get-Content $report | Out-File -Append -Encoding utf8 $log

            Add-Log "smoke test passed"
          } catch {
            Add-Log "FAILED: $($_.Exception.Message)"
            Add-Log "$($_.ScriptStackTrace)"
            Stop-Quietly $main
            Stop-Quietly $first
            Stop-Quietly $strict
            Stop-Quietly $big
            Stop-Quietly $locked
            exit 1
          }

          Stop-Quietly $main
          Stop-Quietly $first
          Stop-Quietly $strict
          Stop-Quietly $big
          Stop-Quietly $locked

      - name: Show smoke test output
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ci/smoke.log) {
            Get-Content ci/smoke.log
            "# Smoke test`n" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
            Get-Content ci/smoke.log | Out-File -Append $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          }

      # Compiler or runtime diagnostics are published both as check annotations
      # and as files in the repository, so that the reason of a failure is
      # visible even when the job log cannot be downloaded.
      - name: Publish diagnostics
        if: steps.build.outcome == 'failure' || steps.smoke.outcome == 'failure'
        shell: pwsh
        run: |
          $errors = @()
          if (Test-Path ci/build.log) {
            $errors += Select-String -Path ci/build.log -Pattern 'error [A-Z]+[0-9]+' |
              ForEach-Object { $_.Line.Trim() } | Select-Object -Unique -First 8
          }
          if (Test-Path ci/smoke.log) {
            $errors += Get-Content ci/smoke.log | Select-Object -Last 12
          }
          foreach ($line in $errors) { Write-Host "::error::$line" }
          if ($errors.Count -gt 0) {
            "# Diagnostics`n" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
            $errors | Out-File -Append $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          }

      - name: Commit diagnostics
        if: (steps.build.outcome == 'failure' || steps.smoke.outcome == 'failure') && github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Get-ChildItem ci -Filter *.log | ForEach-Object { git add -f $_.FullName }
          git diff --cached --quiet; if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "ci: build log [skip ci]"
          git push

      - name: Upload artifact
        if: steps.build.outcome == 'success' && steps.smoke.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: REAL-x64
          path: |
            ${{ env.BUILD_DIR }}/Release/REAL.exe
            ci/smoke.log
          if-no-files-found: error

      - name: Fail when a step failed
        if: steps.build.outcome == 'failure' || steps.smoke.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "Build or smoke test failed, see ci/*.log"
          exit 1

  release:
    name: Attach the executable to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -S real-app -B ${{ env.BUILD_DIR }} -A x64

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config Release --parallel

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "REAL $tag" --generate-notes
          }
          gh release upload $tag "${{ env.BUILD_DIR }}/Release/REAL.exe#REAL.exe" --clobber
